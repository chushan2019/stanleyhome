<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Cache-Control" content="no-store" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>内容后台 · Stanley · 初山</title>
    <script>
      /**
       * 启动期配置诊断日志。
       * 背景：Decap 的 GitHub 后端只读 backend.base_url 来决定 OAuth 中转地址；
       * 该键一旦缺失/写错，它会静默回退到 https://api.netlify.com/auth 并返回 404，
       * 界面上没有任何报错。这里把关键配置与「实际会打开的登录 URL」打到控制台，
       * 让这类静默失败一眼可见。日志不影响 CMS 运行，可随时删除本段。
       */
      (function () {
        const NETLIFY_FALLBACK = 'https://api.netlify.com';
        fetch('config.yml', { credentials: 'same-origin', cache: 'no-store' })
          .then((r) => (r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status))))
          .then((text) => {
            const pick = (key) => {
              const m = text.match(new RegExp('^\\s*' + key + '\\s*:\\s*(.+?)\\s*$', 'm'));
              return m ? m[1].replace(/^["']|["']$/g, '') : null;
            };
            const name = pick('name');
            const baseUrl = pick('base_url');
            const proxyUrl = pick('proxy_url');
            const localBackend = pick('local_backend');
            const isLocalHost = ['localhost', '127.0.0.1'].includes(location.hostname);

            const cfg = { 'backend.name': name, 'backend.base_url': baseUrl, 'backend.proxy_url': proxyUrl, local_backend: localBackend };
            console.group('[admin] Decap 后端配置诊断');
            console.log('解析到的配置：', cfg);

            if (proxyUrl) console.warn('[admin] 检测到 proxy_url —— 这不是 github 后端的有效键，会被 Decap 静默忽略。OAuth 中转请改用 backend.base_url。');
            if (!baseUrl) {
              console.error(
                `[admin] 缺少 backend.base_url，Decap 将回退到 ${NETLIFY_FALLBACK}/auth，点登录会直接 404。` +
                  (isLocalHost ? '（本地 local_backend 生效，可免登录）' : '（线上必修）')
              );
            } else if (baseUrl.includes('REPLACE-WITH')) {
              console.warn('[admin] base_url 仍是占位符，尚未指向真实 OAuth Worker，线上登录会失败。见 docs/ADMIN.md。');
            }

            const effective = (baseUrl || NETLIFY_FALLBACK).replace(/\/+$/, '');
            console.log('[admin] 点击「Login with GitHub」实际会打开的地址：');
            console.log(`${effective}/auth?provider=github&site_id=${location.hostname}&scope=repo`);
            if (localBackend === 'true' && !isLocalHost) {
              console.warn('[admin] local_backend: true 在非 localhost 域名下不生效，线上仍走 GitHub OAuth。');
            }
            console.groupEnd();
          })
          .catch((e) => console.warn('[admin] 配置诊断未能读取 config.yml：', e.message));
      })();
    </script>
  </head>
  <body>
    <!-- Decap CMS（静态站内容管理系统），config.yml 同目录 -->
    <script src="https://unpkg.com/decap-cms@3.8.0/dist/decap-cms.js"></script>
    <script>
      /**
       * 富文本粘贴防护（2026-09 事故修复）。
       * 现象：从网页复制文章正文粘贴进「正文」编辑器，整页崩溃：
       *   TypeError: Cannot destructure property 'url' of 'e.element.data' as it is undefined
       * 根因：Decap 富文本粘贴会抓取 HTML 里的远程 <img> 自动下载转存；遇到无 src 的
       * 懒加载占位图/内联 svg 等畸形节点时，预览渲染器对无 data 的 image 节点解构崩溃。
       * 上游至 decap-cms 3.16.2 仍未修复（已核对产物源码），升级无效。
       * 对策：捕获阶段拦截「HTML 富文本 → 正文编辑器」的粘贴，自行转成结构良好的
       * Markdown 文本后以纯文本插入（纯文本路径已回归验证不会崩溃），并阻断事件传播，
       * 使 Decap 的抓图管线完全不参与。文件粘贴（截图）与普通粘贴不受影响。
       */
      (function () {
        const SKIP = { SCRIPT: 1, STYLE: 1, NOSCRIPT: 1, IFRAME: 1, VIDEO: 1, AUDIO: 1, CANVAS: 1, SVG: 1, FORM: 1, BUTTON: 1, INPUT: 1, SELECT: 1, TEXTAREA: 1, NAV: 1, ASIDE: 1, FOOTER: 1, HEADER: 1 };
        function esc(t) {
          return t.replace(/[	 ​]/g, ' ').replace(/[<>&]/g, (c) => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;' })[c]);
        }
        function walk(node, out) {
          for (const ch of node.childNodes) out.push(render(ch));
        }
        function inline(n) {
          const out = [];
          walk(n, out);
          return out.join('').replace(/\s*\n\s*/g, ' ').trim();
        }
        function render(n) {
          if (n.nodeType === 3) return esc(n.textContent);
          if (n.nodeType !== 1) return '';
          const tag = n.tagName.toUpperCase();
          if (SKIP[tag]) return '';
          switch (tag) {
            case 'H1': case 'H2': case 'H3': case 'H4': case 'H5': case 'H6':
              return '#'.repeat(+tag[1]) + ' ' + inline(n) + '\n\n';
            case 'P': return inline(n) + '\n\n';
            case 'BR': return '\n';
            case 'STRONG': case 'B': { const t = inline(n); return t ? '**' + t + '**' : ''; }
            case 'EM': case 'I': { const t = inline(n); return t ? '*' + t + '*' : ''; }
            case 'DEL': { const t = inline(n); return t ? '~~' + t + '~~' : ''; }
            case 'CODE': return '`' + inline(n) + '`';
            case 'PRE': return '```\n' + n.textContent.replace(/\s+$/, '') + '\n```\n\n';
            case 'A': {
              const href = (n.getAttribute('href') || '').trim();
              const t = inline(n);
              if (!href || href.startsWith('javascript:')) return t;
              return '[' + (t || href) + '](' + href + ')';
            }
            case 'IMG': {
              const src = (n.getAttribute('src') || n.getAttribute('data-src') || '').trim();
              const alt = (n.getAttribute('alt') || '').trim();
              // 关键：粘贴路径下的 ![]() 图片语法会触发 Decap 抓图/渲染管线崩溃（本地复现实锤），
              // 故图片一律转为文字占位，URL 保留在括号内；需要真图时用工具栏/上传手动补。
              if (/^https?:\/\//i.test(src)) return '（图：' + (alt || '图片') + ' ' + src + '）';
              return alt ? '（图：' + alt + '）' : '';
            }
            case 'BLOCKQUOTE':
              return inline(n).split('\n').map((l) => '> ' + l).join('\n') + '\n\n';
            case 'UL':
              return [...n.children].filter((c) => c.tagName === 'LI').map((li) => '- ' + inline(li)).join('\n') + '\n\n';
            case 'OL':
              return [...n.children].filter((c) => c.tagName === 'LI').map((li, i) => i + 1 + '. ' + inline(li)).join('\n') + '\n\n';
            case 'HR': return '---\n\n';
            case 'TABLE': {
              const rows = [...n.querySelectorAll('tr')].map((tr) =>
                [...tr.children].map((td) => inline(td).replace(/\|/g, '\\|')).join(' | ')
              ).filter(Boolean);
              if (!rows.length) return '';
              return rows[0] + '\n' + rows[0].split(' | ').map(() => '---').join(' | ') + '\n' + rows.slice(1).join('\n') + '\n\n';
            }
            case 'FIGURE': case 'FIGCAPTION': case 'ARTICLE': case 'SECTION': case 'MAIN': case 'DIV': case 'SPAN': {
              const out = [];
              walk(n, out);
              return out.join('');
            }
            default: return inline(n);
          }
        }
        function htmlToMd(html) {
          const doc = new DOMParser().parseFromString(html, 'text/html');
          const out = [];
          walk(doc.body, out);
          return out.join('').replace(/ /g, ' ').replace(/\n{3,}/g, '\n\n').trim();
        }
        const toast = (msg) => {
          let el = document.getElementById('stanley-paste-toast');
          if (!el) {
            el = document.createElement('div');
            el.id = 'stanley-paste-toast';
            el.style.cssText =
              'position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:99999;background:#1d2229;color:#eef2f7;padding:12px 18px;border-radius:10px;border:1px solid rgba(255,255,255,.18);box-shadow:0 8px 30px rgba(0,0,0,.4);font:13px/1.6 system-ui;max-width:80vw;transition:opacity .4s';
            document.body.appendChild(el);
          }
          el.textContent = msg;
          el.style.opacity = '1';
          clearTimeout(el.__t);
          el.__t = setTimeout(() => (el.style.opacity = '0'), 7000);
        };
        const sanitize = (x) => x.replace(/!\[([^\]]*)\]\(([^)]*)\)/g, '（图：$1 $2）').replace(/!\[([^\]]*)\]\[[^\]]*\]/g, '（图：$1）');
        document.addEventListener(
          'paste',
          (e) => {
            const t = e.target;
            if (!t || !t.closest || !t.closest('.cm-editor, .cm-content, [role="textbox"]')) return; // 只管正文/Markdown 编辑器
            const cd = e.clipboardData;
            if (!cd) return;
            if (cd.files && cd.files.length) return; // 截图/文件粘贴 → 放行给 Decap 原上传管线
            const html = cd.getData('text/html');
            const text = cd.getData('text/plain') || '';
            if (!html && !/!\[/.test(text)) return; // 纯文本且不含图片语法 → 原样放行（已验证安全）
            // Chrome 对 paste 事件 clipboardData 的写入是静默无效的（回读仍是原 HTML）。
            // 因此：拦下本次粘贴（阻止 Decap 抓图/渲染管线），把「HTML→Markdown、图片转
            // 文字占位」的净化文本写回【系统剪贴板】，提示再按一次 ⌘V ——
            // 第二次即原生纯文本粘贴：状态可靠提交，且不再触发崩溃路径。
            e.preventDefault();
            e.stopImmediatePropagation();
            const md = sanitize(html ? htmlToMd(html) || text : text);
            const fallbackCopy = () => {
              const ta = document.createElement('textarea');
              ta.value = md;
              ta.style.cssText = 'position:fixed;left:-9999px';
              document.body.appendChild(ta);
              ta.select();
              try { document.execCommand('copy'); } catch (err) {}
              ta.remove();
            };
            const notice = '已拦截网页格式并转存为纯文本：请按 ⌘V 再粘贴一次（图片已转为文字占位，可用工具栏重新插图）';
            if (navigator.clipboard && navigator.clipboard.writeText) {
              navigator.clipboard.writeText(md).then(() => toast(notice)).catch(() => { fallbackCopy(); toast(notice); });
            } else {
              fallbackCopy();
              toast(notice);
            }
          },
          true
        );
        console.log('[admin] 粘贴防护已启用（拦截网页格式→剪贴板转纯文本→二次粘贴）');
      })();
    </script>
  </body>
</html>
