name = "cms-oauth"
main = "index.js"
compatibility_date = "2026-01-01"

# 部署（一次性，需要 Cloudflare 免费账号）：
#   cd workers/cms-oauth
#   npx wrangler secret put GITHUB_CLIENT_ID      # 粘贴 OAuth App 的 Client ID
#   npx wrangler secret put GITHUB_CLIENT_SECRET  # 粘贴 Client Secret
#   npx wrangler deploy
# 部署后把 https://cms-oauth.<你的子域>.workers.dev 填进
# public/admin/config.yml 的 proxy_url，然后 push。
